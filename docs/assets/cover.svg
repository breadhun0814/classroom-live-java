<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Classroom Live</title>
  <desc id="desc">Self-hosted classroom collaboration. Java HTTPS, WebRTC, LAN.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#152d42"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#86a5ff"/><stop offset="1" stop-color="#73e1cf"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="22" fill="url(#bg)"/>
  <path d="M48 54H1232" stroke="#35506a"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="52" y="37" font-size="12" font-weight="700" letter-spacing="3" fill="#aac2d6">CLASSROOM COLLABORATION / JAVA PROJECT</text>
    <text x="52" y="146" font-size="68" font-weight="750" letter-spacing="-2" fill="#f0f6fc">Classroom <tspan fill="#8fc5ff">Live</tspan></text>
    <text x="56" y="191" font-size="23" fill="#bcd0df">One classroom. One server. A shared workspace.</text>
    <g font-size="14" font-weight="600" fill="#d5e8f6">
      <rect x="54" y="235" width="128" height="36" rx="18" fill="#263c54"/><text x="79" y="258">Java HTTPS</text>
      <rect x="194" y="235" width="134" height="36" rx="18" fill="#263c54"/><text x="219" y="258">WebRTC P2P</text>
      <rect x="340" y="235" width="122" height="36" rx="18" fill="#263c54"/><text x="368" y="258">LAN only</text>
    </g>
    <text x="56" y="321" font-size="12" letter-spacing="2" fill="#8eabbe">SCREEN SHARING / CODE CHAT / LOCAL ACCOUNTS</text>
    <path d="M983 155V110H1123 M983 155V246H1123" fill="none" stroke="#74d7ca" stroke-width="2" stroke-dasharray="5 6"/>
    <rect x="800" y="115" width="222" height="130" rx="12" fill="#17283e" stroke="#85acff" stroke-width="2"/>
    <rect x="814" y="129" width="194" height="89" rx="5" fill="#263f59"/>
    <path d="M870 154L853 170L870 186 M950 154L967 170L950 186 M920 148L901 193" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M890 245V262H931V245 M868 263H953" fill="none" stroke="#85acff" stroke-width="3"/>
    <g fill="#1d364b" stroke="#74d7ca" stroke-width="1.5">
      <rect x="1087" y="80" width="128" height="73" rx="8"/><rect x="1087" y="214" width="128" height="73" rx="8"/>
    </g>
    <g fill="#c9eee7" font-size="13" text-anchor="middle"><text x="1151" y="111">LOCAL</text><text x="1151" y="132">ACCOUNTS</text><text x="1151" y="246">PEER</text><text x="1151" y="267">VIDEO</text></g>
    <text x="909" y="303" font-size="11" text-anchor="middle" letter-spacing="2" fill="#91b3c7">SELF-HOSTED</text>
  </g>
</svg>
